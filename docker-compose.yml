services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ragflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragflow_dev_password}
      POSTGRES_DB: ragflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragflow -d ragflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ragflow:${POSTGRES_PASSWORD:-ragflow_dev_password}@postgres:5432/ragflow
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
